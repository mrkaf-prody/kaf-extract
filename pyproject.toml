[project]
name = "kaf-extract"
version = "0.1.0"
description = "API-First Data Extraction Micro-Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "crawl4ai>=0.6.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "slowapi>=0.1",
    "python-dotenv>=1.0",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.18",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    # Webhook dispatch
    "httpx>=0.28",
    "pyotp>=2.9.0",
    "qrcode[pil]>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]
payments = [
    "resend>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
