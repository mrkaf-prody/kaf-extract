version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/kaf-extract.db
      - DEV_API_KEY=${DEV_API_KEY:-kaf-extract-dev-key-change-in-production}
      - PLAYWRIGHT_HEADLESS=true
    volumes:
      - ./data:/app/data
    restart: unless-stopped
