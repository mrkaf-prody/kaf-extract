[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaf-extract"
version = "1.0.0"
description = "Official Python SDK for Kaf Extract — AI-powered web data extraction API"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Kaf Center", email = "hermizy@kafcenter.com"}
]
keywords = ["web-scraping", "data-extraction", "crawl4ai", "ai-extraction", "kaf-extract"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://extract.kafcenter.com"
Documentation = "https://extract.kafcenter.com/docs"
Repository = "https://github.com/mrkaf-prody/kaf-extract"

[tool.hatch.build.targets.wheel]
packages = ["kaf_extract"]
